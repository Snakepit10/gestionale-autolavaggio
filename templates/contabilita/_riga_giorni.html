<tr class="riga-voce"><td class="col-nome">{{ g.nome }}</td><td class="tab-num">{{ g.giorni }}</td><td class="tab-num">{{ g.lavaggi|floatformat:1 }}</td><td class="tab-num">{{ g.persone|floatformat:1 }}</td><td class="tab-num">{% if g.lavaggi_persona != None %}{{ g.lavaggi_persona|floatformat:1 }}{% else %}&mdash;{% endif %}</td><td class="tab-num">&euro;{{ g.ricavo|floatformat:"0g" }}</td>{% if g.consigliate != None %}<td class="tab-num {% if g.consigliate < g.persone %}giu{% endif %}">{{ g.consigliate }}</td>{% endif %}</tr>
