<div class="modal fade" id="modaleArticolo" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header modal-clean">
                <h5 class="modal-title" id="art-titolo">Nuovo articolo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="art-id">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label">Nome *</label>
                        <input type="text" class="form-control" id="art-nome">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Codice</label>
                        <input type="text" class="form-control" id="art-codice">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Tipo</label>
                        <select class="form-select" id="art-tipo">
                            {% for k, v in tipi %}<option value="{{ k }}">{{ v }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Categoria</label>
                        <input type="text" class="form-control" id="art-categoria" list="art-categorie" autocomplete="off" placeholder="es. Panni, Detergenti">
                        <datalist id="art-categorie">{% for c in categorie %}<option value="{{ c }}">{% endfor %}</datalist>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Si conta a</label>
                        <input type="text" class="form-control" id="art-unita" value="pz" list="art-unita-l" oninput="aggiornaPrezzo()">
                        <datalist id="art-unita-l"><option value="pz"><option value="bidoni"><option value="taniche"><option value="flaconi"><option value="confezioni"><option value="rotoli"></datalist>
                    </div>
                    <div class="col-12">
                        <div class="border rounded p-2 bg-light">
                            <div class="row g-2 align-items-end">
                                <div class="col-6 col-md-3">
                                    <label class="form-label small mb-0">Ogni pezzo contiene</label>
                                    <input type="text" inputmode="decimal" class="form-control" id="art-contenuto" placeholder="es. 25" oninput="aggiornaPrezzo()">
                                </div>
                                <div class="col-6 col-md-3">
                                    <label class="form-label small mb-0">Unità</label>
                                    <select class="form-select" id="art-unita-contenuto" onchange="aggiornaPrezzo()">
                                        <option value="">—</option>
                                        {% for k, v in unita_contenuto %}<option value="{{ k }}">{{ v }}</option>{% endfor %}
                                    </select>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label small mb-0">Il prezzo lo indico</label>
                                    <div class="btn-group w-100">
                                        <input type="radio" class="btn-check" name="art-prezzo-per" id="art-pp-pezzo" value="pezzo" onchange="cambiaBasePrezzo()" checked>
                                        <label class="btn btn-outline-secondary" for="art-pp-pezzo" id="art-pp-pezzo-l">al pezzo</label>
                                        <input type="radio" class="btn-check" name="art-prezzo-per" id="art-pp-contenuto" value="contenuto" onchange="cambiaBasePrezzo()">
                                        <label class="btn btn-outline-secondary" for="art-pp-contenuto" id="art-pp-contenuto-l">al kg / litro</label>
                                    </div>
                                </div>
                            </div>
                            <small class="text-muted">Per un bidone da 25 kg: si conta a "bidoni", contiene 25 kg. Lascia vuoto se non serve.</small>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-check form-switch mt-md-4">
                            <input class="form-check-input" type="checkbox" id="art-traccia" checked>
                            <label class="form-check-label" for="art-traccia">Controlla la quantità</label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Scorta minima</label>
                        <input type="number" min="0" class="form-control" id="art-scorta" value="0">
                    </div>
                    <div class="col-md-4" id="art-iniziale-box">
                        <label class="form-label">Quantità iniziale</label>
                        <input type="number" min="0" class="form-control" id="art-iniziale" value="0">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" id="art-costo-l">Costo al pezzo (&euro;)</label>
                        <input type="text" inputmode="decimal" class="form-control" id="art-costo" value="0" oninput="aggiornaPrezzo()">
                        <small class="text-muted" id="art-costo-altro"></small>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">Fornitore abituale</label>
                        <select class="form-select" id="art-fornitore">
                            <option value="">—</option>
                            {% for f in fornitori %}<option value="{{ f.pk }}">{{ f }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Note</label>
                        <textarea class="form-control" id="art-note" rows="2"></textarea>
                    </div>
                    <div class="col-12">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="art-attivo" checked>
                            <label class="form-check-label" for="art-attivo">Attivo</label>
                        </div>
                    </div>
                </div>
                <div class="alert alert-danger d-none mt-3 mb-0" id="art-errore"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
                <button type="button" class="btn btn-primary" onclick="salvaArticolo()"><i class="bi bi-check-circle"></i> Salva</button>
            </div>
        </div>
    </div>
</div>
