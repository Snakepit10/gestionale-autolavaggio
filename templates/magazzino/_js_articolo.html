<script>
const URL_ARTICOLO_SALVA = "{% url 'magazzino:articolo-salva' %}";
const URL_MOVIMENTO = "{% url 'magazzino:articolo-movimento' 999999 %}";
const CATEGORIA_CATALOGO_DEFAULT = "{{ categoria_catalogo_default }}";

// Prodotto in vendita: prezzo e categoria in cassa; la categoria
// dell'articolo diventa la sottocategoria della cassa
function tipoArticolo() {
    const vendita = document.getElementById('art-tipo').value === 'vendita';
    document.getElementById('art-vendita-box').classList.toggle('d-none', !vendita);
    document.getElementById('art-categoria-l').textContent = vendita ? 'Sottocategoria in cassa' : 'Categoria';
    document.getElementById('art-categoria').setAttribute('list', vendita ? 'art-sottocategorie' : 'art-categorie');
    document.getElementById('art-categoria').placeholder = vendita ? 'es. Profumi, Panni e Accessori' : 'es. Panni, Detergenti';
}

const USI_ARTICOLO = [{% for campo, etichetta, sigla in usi %}'{{ campo }}'{% if not forloop.last %}, {% endif %}{% endfor %}];

function sceltaPosto() {
    const nuovo = document.getElementById('art-posto').value === '__nuovo';
    const campo = document.getElementById('art-posto-nuovo');
    campo.classList.toggle('d-none', !nuovo);
    if (nuovo) campo.focus();
}

const URL_FOTO_CARICA = "{% url 'magazzino:articolo-foto-carica' 999999 %}";
let fotoAttuale = '';

function mostraAnteprima(src) {
    const img = document.getElementById('art-foto-anteprima');
    img.src = src || '';
    img.classList.toggle('d-none', !src);
}

function anteprimaFoto(input) {
    if (input.files && input.files[0]) {
        mostraAnteprima(URL.createObjectURL(input.files[0]));
        document.getElementById('art-foto-togli').checked = false;
    } else {
        mostraAnteprima(fotoAttuale);
    }
}

function togliFoto(box) {
    if (box.checked) { document.getElementById('art-foto').value = ''; mostraAnteprima(''); }
    else mostraAnteprima(fotoAttuale);
}

async function caricaFoto(id) {
    const file = document.getElementById('art-foto').files[0];
    const togli = document.getElementById('art-foto-togli').checked;
    if (!file && !togli) return {success: true};
    const dati = new FormData();
    if (file) dati.append('foto', file); else dati.append('elimina', '1');
    const r = await fetch(URL_FOTO_CARICA.replace('999999', id), {method: 'POST', headers: {'X-CSRFToken': csrf(), 'X-Requested-With': 'XMLHttpRequest'}, body: dati});
    try { return await r.json(); } catch (e) { return {success: false, error: 'Caricamento della foto non riuscito (' + r.status + ')'}; }
}

function apriArticolo(id, a) {
    a = a || {};
    document.getElementById('art-titolo').textContent = id ? 'Modifica articolo' : 'Nuovo articolo';
    document.getElementById('art-id').value = id || '';
    document.getElementById('art-nome').value = a.nome || '';
    document.getElementById('art-codice').value = a.codice || '';
    document.getElementById('art-tipo').value = a.tipo || 'consumabile';
    document.getElementById('art-prezzo-vendita').value = a.prezzo_vendita || '';
    document.getElementById('art-categoria-catalogo').value = a.categoria_catalogo || CATEGORIA_CATALOGO_DEFAULT;
    document.getElementById('art-categoria').value = a.categoria || '';
    document.getElementById('art-unita').value = a.unita || 'pz';
    document.getElementById('art-contenuto').value = a.contenuto || '';
    document.getElementById('art-unita-contenuto').value = a.unita_contenuto || '';
    document.getElementById(a.prezzo_per === 'contenuto' ? 'art-pp-contenuto' : 'art-pp-pezzo').checked = true;
    basePrezzoAttuale = a.prezzo_per === 'contenuto' ? 'contenuto' : 'pezzo';
    document.getElementById('art-scorta').value = a.scorta_minima != null ? a.scorta_minima : 0;
    document.getElementById('art-traccia').checked = a.traccia_scorte !== false;
    document.getElementById('art-costo').value = a.costo || '0';
    document.getElementById('art-fornitore').value = a.fornitore || '';
    document.getElementById('art-note').value = a.note || '';
    document.getElementById('art-posto').value = a.posto || '';
    document.getElementById('art-posto-vendita').value = a.posto_vendita || '';
    document.getElementById('art-posto-nuovo').value = '';
    sceltaPosto();
    USI_ARTICOLO.forEach(c => document.getElementById('art-' + c).checked = !!a[c]);
    document.getElementById('art-diluizione').value = a.diluizione || '';
    document.getElementById('art-modo-uso').value = a.modo_uso || '';
    document.getElementById('art-avvertenze').value = a.avvertenze || '';
    document.getElementById('art-link-produttore').value = a.link_produttore || '';
    document.getElementById('art-attivo').checked = a.attivo !== false;
    document.getElementById('art-iniziale').value = 0;
    document.getElementById('art-iniziale-box').classList.toggle('d-none', !!id);
    fotoAttuale = a.url_foto || '';
    document.getElementById('art-foto').value = '';
    document.getElementById('art-foto-togli').checked = false;
    document.getElementById('art-foto-togli-box').classList.toggle('d-none', !fotoAttuale);
    mostraAnteprima(fotoAttuale);
    aggiornaPrezzo();
    tipoArticolo();
    document.getElementById('art-errore').classList.add('d-none');
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modaleArticolo')).show();
    setTimeout(() => document.getElementById('art-nome').focus(), 300);
}

async function salvaArticolo() {
    const val = id => document.getElementById(id).value;
    const j = await postJSON(URL_ARTICOLO_SALVA, {
        id: val('art-id') || null, nome: val('art-nome'), codice: val('art-codice'), tipo: val('art-tipo'),
        categoria: val('art-categoria'), unita: val('art-unita'), scorta_minima: val('art-scorta'),
        contenuto: val('art-contenuto'), unita_contenuto: val('art-unita-contenuto'),
        prezzo_per: document.querySelector('[name=art-prezzo-per]:checked').value,
        prezzo_vendita: val('art-prezzo-vendita'), categoria_catalogo: val('art-categoria-catalogo') || null,
        traccia_scorte: document.getElementById('art-traccia').checked, costo: val('art-costo'),
        fornitore: val('art-fornitore') || null, note: val('art-note'),
        posto: val('art-posto') === '__nuovo' ? null : (val('art-posto') || null),
        posto_vendita: val('art-posto-vendita') || null,
        posto_nuovo: val('art-posto') === '__nuovo' ? val('art-posto-nuovo') : '',
        ...Object.fromEntries(USI_ARTICOLO.map(c => [c, document.getElementById('art-' + c).checked])),
        diluizione: val('art-diluizione'), modo_uso: val('art-modo-uso'), avvertenze: val('art-avvertenze'),
        link_produttore: val('art-link-produttore'),
        attivo: document.getElementById('art-attivo').checked, quantita_iniziale: val('art-iniziale'),
    });
    const errore = msg => { const e = document.getElementById('art-errore'); e.textContent = msg; e.classList.remove('d-none'); };
    if (!j.success) { errore(j.error); return; }
    const foto = await caricaFoto(j.id);
    if (!foto.success) {
        // l'articolo e' salvato: si riprova solo la foto
        document.getElementById('art-id').value = j.id;
        errore('Articolo salvato, ma la foto no: ' + foto.error);
        return;
    }
    location.reload();
}

// --- contenuto del pezzo e prezzo al pezzo / al kg ---
const numero = v => Number(String(v || '').replace(',', '.')) || 0;
const cifre = v => String(Math.round(v * 10000) / 10000).replace('.', ',');
let basePrezzoAttuale = 'pezzo';

function datiPezzo() {
    return {
        contenuto: numero(document.getElementById('art-contenuto').value),
        unita: document.getElementById('art-unita-contenuto').value,
        conta: document.getElementById('art-unita').value || 'pz',
    };
}

function cambiaBasePrezzo() {
    // converte il prezzo scritto nella nuova base
    const p = datiPezzo();
    const nuova = document.querySelector('[name=art-prezzo-per]:checked').value;
    const costo = document.getElementById('art-costo');
    if (p.contenuto && p.unita && numero(costo.value) && nuova !== basePrezzoAttuale) {
        costo.value = cifre(nuova === 'contenuto' ? numero(costo.value) / p.contenuto : numero(costo.value) * p.contenuto);
    }
    basePrezzoAttuale = nuova;
    aggiornaPrezzo();
}

function aggiornaPrezzo() {
    const p = datiPezzo();
    const conContenuto = !!(p.contenuto && p.unita);
    const perContenuto = document.getElementById('art-pp-contenuto');
    perContenuto.disabled = !conContenuto;
    if (!conContenuto && perContenuto.checked) {
        document.getElementById('art-pp-pezzo').checked = true;
        basePrezzoAttuale = 'pezzo';
    }
    document.getElementById('art-pp-pezzo-l').textContent = 'al pezzo (' + p.conta + ')';
    document.getElementById('art-pp-contenuto-l').textContent = conContenuto ? 'al ' + p.unita : 'al kg / litro';
    const base = document.querySelector('[name=art-prezzo-per]:checked').value;
    document.getElementById('art-costo-l').textContent = 'Costo ' + (base === 'contenuto' ? 'al ' + p.unita : 'al pezzo') + ' (€)';
    const costo = numero(document.getElementById('art-costo').value);
    let altro = '';
    if (conContenuto && costo) {
        altro = base === 'contenuto'
            ? '= €' + cifre(costo * p.contenuto) + ' al pezzo (' + cifre(p.contenuto) + ' ' + p.unita + ')'
            : '= €' + cifre(costo / p.contenuto) + ' al ' + p.unita;
    }
    document.getElementById('art-costo-altro').textContent = altro;
}

const SPIEGA_MOVIMENTO = {
    carico: 'Merce entrata in magazzino senza una consegna registrata (per le consegne dei fornitori usa il Registro consegne).',
    scarto: 'Merce tolta dal magazzino: rotta, scaduta, usata in sede.',
    rettifica: 'Inventario: scrivi la quantità che hai contato, la differenza viene registrata.',
};
let movQuantitaAttuale = 0;

// Giacenze per posto dell'articolo aperto ('' = senza posto)
let movDati = {giacenze: {}};

function apriMovimento(id, tipo, a) {
    movDati = a;
    document.getElementById('mov-costo-l').textContent = 'Costo al ' + (a.unita_prezzo || 'pezzo') + ' (€)';
    document.getElementById('mov-articolo').value = id;
    document.getElementById('mov-titolo').textContent = a.nome + ' (ora ' + a.quantita + ')';
    // posto proposto: il principale, o quello con piu' merce per scarti e inventari
    const conMerce = Object.entries(a.giacenze || {}).filter(([p, q]) => q > 0).sort((x, y) => y[1] - x[1]);
    let posto = a.posto === '' || a.posto == null ? '' : String(a.posto);
    if (tipo !== 'carico' && conMerce.length && !(posto in (a.giacenze || {}))) posto = conMerce[0][0];
    const sel = document.getElementById('mov-posto');
    sel.value = posto;
    if (sel.value !== posto) sel.value = '';
    cambiaPostoMovimento(true);
    document.getElementById('mov-' + tipo).checked = true;
    document.getElementById('mov-quantita').value = '';
    document.getElementById('mov-costo').value = '';
    document.getElementById('mov-nota').value = '';
    document.getElementById('mov-motivo').value = '';
    document.getElementById('mov-errore').classList.add('d-none');
    tipoMovimento();
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modaleMovimento')).show();
    setTimeout(() => document.getElementById('mov-quantita').focus(), 300);
}

function cambiaPostoMovimento(senzaTipo) {
    const posto = document.getElementById('mov-posto').value;
    movQuantitaAttuale = movDati.traccia === false ? 0 : ((movDati.giacenze || {})[posto] || 0);
    const piuPosti = Object.values(movDati.giacenze || {}).filter(q => q).length > 1;
    document.getElementById('mov-posto-l').textContent = 'Posto' + (piuPosti ? ' (qui: ' + movQuantitaAttuale + ')' : '');
    if (!senzaTipo) {
        if (document.querySelector('[name=mov-tipo]:checked').value === 'rettifica') {
            document.getElementById('mov-quantita').value = Math.max(movQuantitaAttuale, 0);
        }
        aggiornaMotivo();
    }
}

function tipoMovimento() {
    const tipo = document.querySelector('[name=mov-tipo]:checked').value;
    document.getElementById('mov-posto-l').textContent = (tipo === 'carico' ? 'Entra in' : tipo === 'scarto' ? 'Esce da' : 'Posto contato')
        + (Object.values(movDati.giacenze || {}).filter(q => q).length > 1 ? ' (qui: ' + movQuantitaAttuale + ')' : '');
    document.getElementById('mov-spiega').textContent = SPIEGA_MOVIMENTO[tipo];
    document.getElementById('mov-label-q').textContent = tipo === 'rettifica' ? 'Quantità contata' : 'Quantità';
    document.getElementById('mov-costo-box').classList.toggle('d-none', tipo !== 'carico');
    if (tipo === 'rettifica' && !document.getElementById('mov-quantita').value) {
        document.getElementById('mov-quantita').value = Math.max(movQuantitaAttuale, 0);
    }
    aggiornaMotivo();
}

// Scarto, o inventario che trova meno merce del registrato: motivo obbligatorio
function serveMotivo() {
    const tipo = document.querySelector('[name=mov-tipo]:checked').value;
    const q = document.getElementById('mov-quantita').value;
    return tipo === 'scarto' || (tipo === 'rettifica' && q !== '' && Number(q) < movQuantitaAttuale);
}

function aggiornaMotivo() {
    const serve = serveMotivo();
    const tipo = document.querySelector('[name=mov-tipo]:checked').value;
    document.getElementById('mov-motivo-box').classList.toggle('d-none', !serve);
    document.getElementById('mov-motivo-spiega').textContent = serve && tipo === 'rettifica'
        ? 'Hai contato ' + (movQuantitaAttuale - Number(document.getElementById('mov-quantita').value)) + ' in meno del registrato: perché?' : '';
    const altro = serve && document.getElementById('mov-motivo').value === 'altro';
    document.getElementById('mov-nota-l').textContent = altro ? 'Nota * (spiega il motivo)' : 'Nota';
}

async function salvaMovimento() {
    const id = document.getElementById('mov-articolo').value;
    const j = await postJSON(URL_MOVIMENTO.replace('999999', id), {
        tipo: document.querySelector('[name=mov-tipo]:checked').value,
        quantita: document.getElementById('mov-quantita').value,
        posto: document.getElementById('mov-posto').value,
        motivo: serveMotivo() ? document.getElementById('mov-motivo').value : '',
        costo: document.getElementById('mov-costo').value,
        nota: document.getElementById('mov-nota').value,
    });
    if (!j.success) {
        const e = document.getElementById('mov-errore');
        e.textContent = j.error; e.classList.remove('d-none');
        return;
    }
    location.reload();
}
</script>
