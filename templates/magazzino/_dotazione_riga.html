<div class="dot-card">
    <div class="q">{{ a.quantita }}</div>
    <div class="n">
        <strong>{{ a.articolo.nome }}</strong>
        <span class="badge bg-{{ a.colore_stato }}">{{ a.get_stato_display }}</span>
        <small class="text-muted">dal {{ a.data|date:"d/m/Y" }}{% if a.note %} &middot; {{ a.note }}{% endif %}</small>
    </div>
    <button class="btn btn-outline-warning" onclick="apriStato({{ a.pk }}, '{{ a.articolo.nome|escapejs }}', {{ a.quantita }}, '{% if a.articolo.tipo == 'consumabile' %}esaurito{% else %}usurato{% endif %}')">
        <i class="bi bi-flag"></i> Segnala
    </button>
</div>
