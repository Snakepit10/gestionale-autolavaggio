{% if a.ha_scheda %}
<dl class="mb-0">
    {% if a.diluizione %}<dt>Diluizione</dt><dd class="fs-6 fw-semibold">{{ a.diluizione }}</dd>{% endif %}
    {% if a.modo_uso %}<dt>Modo d'uso</dt><dd>{{ a.modo_uso|linebreaksbr }}</dd>{% endif %}
    {% if a.avvertenze %}<dt class="text-danger"><i class="bi bi-exclamation-triangle"></i> Avvertenze</dt><dd class="mb-0">{{ a.avvertenze|linebreaksbr }}</dd>{% endif %}
</dl>
{% else %}
<span class="text-muted">Non compilata.</span>
{% endif %}
